# DietVala: nginx speed-up for the website (compression + caching).
#
# Why: https://dietvala.com sends the JS/CSS bundles uncompressed (500 KB JS + 400 KB CSS go over the
# wire as-is) and without any cache header, so every visit downloads everything again.
# With this config the same files are ~70% smaller, and repeat visits load from the browser cache.
#
# How to apply on the server (Ubuntu, nginx):
#   1. Open the site config:   sudo nano /etc/nginx/sites-available/default      (or the dietvala.com file)
#   2. Put the "gzip ..." lines inside the existing `server { ... }` block (or in /etc/nginx/nginx.conf `http { }`).
#   3. Put the two `location` blocks inside the `server { ... }` block that serves the website
#      (next to the existing `location / { ... try_files ... /index.html }` for the frontend).
#      Keep the existing `root` / `proxy_pass` lines of your site; only add what is below.
#   4. Test and reload:        sudo nginx -t && sudo systemctl reload nginx
#   5. Check:                  curl -sI -H "Accept-Encoding: gzip" https://dietvala.com/assets/<any-file>.js
#                              -> must show:  Content-Encoding: gzip   and   Cache-Control: ... immutable

# ---- 1. Compression ---------------------------------------------------------------------------
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/ttf
    font/otf;

# ---- 2. Cache (hashed build files never change, so they can be kept for a year) ---------------
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# index.html must always be re-checked, otherwise users keep an old version after a deploy
location = /index.html {
    add_header Cache-Control "no-cache";
}

# ---- 3. Uploaded pictures (menu photos, banners): THIS IS THE BIGGEST FIX ---------------------
# Today nginx serves /uploads/* straight from disk, so the Node backend never sees these requests and its
# resizing (/uploads/<file>?w=400) and cache headers never run: a 1.3 MB menu photo is sent in full
# even to a 100px card. Find your current /uploads block first:
#     sudo grep -rn "uploads" /etc/nginx/
# then change it so that requests WITH ?w=... go to Node (which makes a small cached WebP) and all other
# requests are still served from disk, with a long cache. Keep your existing `alias`/`root` line.
#
#   location /uploads/ {
#       # resized thumbnails are created by the Node backend (port 5000 = the pm2 app)
#       if ($arg_w) {
#           proxy_pass http://127.0.0.1:5000;
#       }
#       # originals: keep whatever alias/root line you already have here, e.g.
#       # alias /root/Diet_Wala/Backend/uploads/;
#       expires 30d;
#       add_header Cache-Control "public, max-age=2592000, immutable";
#       add_header Access-Control-Allow-Origin "*";
#   }
#
# After reload, check:   curl -s -o /dev/null -w "%{size_download} bytes" "https://dietvala.com/uploads/<file>.webp?w=400"
#                        -> should be about 10-20 KB instead of the full size.
